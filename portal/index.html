<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TicketRush</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #111; }
  h1 { margin-bottom: 4px; }
  .sub { color: #666; margin-top: 0; }
  .counter { font-size: 48px; font-weight: 700; margin: 24px 0; }
  .counter.zero { color: #c00; }
  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
  input[type=number] { width: 80px; padding: 6px; font-size: 14px; }
  button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.6; }
  .results { display: flex; gap: 24px; margin-top: 12px; }
  .stat { padding: 12px 20px; border-radius: 8px; min-width: 120px; }
  .stat .n { font-size: 28px; font-weight: 700; }
  .stat .label { font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat.success { background: #e6f7ec; }
  .stat.rejected { background: #fce8e8; }
  #status { font-size: 13px; color: #888; margin-top: 8px; }
</style>
</head>
<body>
  <h1>TicketRush</h1>
  <p class="sub">Live ticket inventory backed by an atomic Redis reservation</p>

  <div class="counter" id="counter">--</div>
  <div id="status">connecting...</div>

  <div class="controls">
    <label for="n">Concurrent requests:</label>
    <input type="number" id="n" value="500" min="1" max="5000" />
    <button id="rush">Simulate Rush</button>
  </div>
  <p class="sub" style="font-size:12px">Counter reset is an admin-only endpoint — see DEPLOY.md, not exposed here.</p>

  <div class="results">
    <div class="stat success">
      <div class="n" id="successCount">0</div>
      <div class="label">Reserved</div>
    </div>
    <div class="stat rejected">
      <div class="n" id="rejectedCount">0</div>
      <div class="label">Sold Out</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
